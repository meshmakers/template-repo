name: $(MajorVersion).$(MinorVersion).$(date:yyMM).$(DayOfMonth)$(rev:rrr)-$(Build.SourceBranchName)

trigger:
  batch: true
  branches:
    include:
      - dev/*
      - test/*
      - main
  tags:
    include:
      - 'r*'

resources:
  repositories:
    - repository: pipelineTemplates
      type: github
      name: meshmakers/octo-pipeline-templates
      endpoint: meshmakers-access-token
      ref: refs/tags/tpl-v1.0.1

variables:
  - group: GitSSHGroup
  - group: ApiKeys-mm-cloud
  - group: OctoDefault
  - name: isRelease
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/tags/r') }}
  - name: isMain
    value: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}
  - name: isTest
    value: ${{ startsWith(variables['Build.SourceBranch'], 'refs/heads/test') }}
  - name: OctoLibVersion
    value: 'beta' # overridden at runtime by update-build-number.yml (beta/test/latest)
  - name: OctoReleaseVersion
    value: '3.4.*' # octo-ckc / octo-bpm tool line for the catalog steps, same line as Directory.Build.props

stages:
  - stage: Build
    jobs:
      - job: frontend
        displayName: Frontend Build
        pool:
          name: meshmakers-ci-agents
        steps:
          - template: templates/steps/update-build-number.yml@pipelineTemplates
          - checkout: self
            clean: true
            submodules: recursive
          - template: set-version.yml
          - task: InstallSSHKey@0
            inputs:
              knownHostsEntry: '$(SSHKnownHosts)'
              sshPublicKey: '$(SSHPublicKey)'
              sshPassphrase: '$(SSHPassphrase)'
              sshKeySecureFile: '$(SSHPrivateKeyFile)'
          - template: download-ca.yml
          - template: setup-telerik-license.yml
          - template: run-tests.yml
          - template: build-and-push-docker-image.yml
            parameters:
              PublicRegistryServiceConnection: $(DockerRegistryPublicAcrConnection)
              PrivateRegistryName: $(DockerRegistryPrivateUri)
              PublicRegistryName: $(DockerRegistryInternalUri)
              Repository: meshmakers/custom-app
              Dockerfile: src/custom-app/Dockerfile
          - task: HelmInstaller@1
            displayName: 'Install Helm'
            inputs:
              helmVersionToInstall: '4.2.4'
          - task: HelmDeploy@0
            displayName: 'helm package custom-app'
            inputs:
              command: package
              chartPath: '$(System.DefaultWorkingDirectory)/src/charts/custom-app'
              chartVersion: '$(BuildNumberShort)'
              destination: '$(Build.artifactstagingdirectory)'
              arguments: '--app-version $(Build.BuildNumber) --dependency-update'
          - template: handle-artifacts.yml

      # ─── Construction Kit + Blueprint catalogs ──────────────────────────
      # Uncomment after ./init.sh, once src/CustomAppCkModel and
      # src/blueprints/CustomApp carry your own model and blueprint.
      # Kept disabled in the template: main and r* builds publish, and a
      # published version can never be withdrawn from the shared catalogs.
      #
      # Both shared steps validate (version + schema) on every branch and publish
      # only on main (private catalog) and r* tags (private AND public). The
      # catalogs come from update-build-number.yml; this repo never names one.
      # Already published versions are skipped, never overwritten — bump the
      # version in ckModel.yaml / blueprint.yaml whenever the content changes.
      #
      # dependsOn: frontend — publish only after tests and build succeeded.
      # CK models before blueprints: a blueprint needs its model in the catalog.
      # Nothing in CI runs `dotnet build` on the CK project, so the shared step is
      # its only publisher. If you add such a build, pass /p:OctoPublishCkModel=false.
      #
      # - job: catalogs
      #   displayName: Construction Kit + Blueprints
      #   dependsOn: frontend
      #   pool:
      #     name: meshmakers-ci-agents
      #   steps:
      #     - template: templates/steps/update-build-number.yml@pipelineTemplates
      #     - checkout: self
      #       clean: true
      #     - template: templates/steps/validate-and-publish-ck-versions.yml@pipelineTemplates
      #       parameters:
      #         constructionKitPaths:
      #           - 'src/CustomAppCkModel/ConstructionKit'
      #         toolVersion: '$(OctoReleaseVersion)'
      #     - template: templates/steps/validate-and-publish-blueprints.yml@pipelineTemplates
      #       parameters:
      #         blueprintPaths:
      #           - 'src/blueprints/CustomApp'
      #         toolVersion: '$(OctoReleaseVersion)'

# GraphQL code generation for the optional sample (npm run codegen:sample, part of npm run codegen:check).
#
# Schema: the committed fresh-tenant schema graphql/ci.schema.graphql plus graphql/sample.schema.graphql, a small
# hand-derived excerpt of the sample CK model (`src/CustomAppCkModel`). It does not read your tenant schema, so the
# sample generates the same code on every machine, in CI and in the Docker build.
#
# The generated files are not committed (.gitignore). When you change the sample query or the sample CK model, update
# graphql/sample.schema.graphql too; npm run test:codegen fails when it no longer matches the CK model.
#
# importSchemaTypesFrom: the operation files import the schema types (enums, inputs) from the generated globalTypes.ts.
# nonOptionalTypename / skipTypeNameForRoot: every object type carries a required __typename, the root query none.
# inputMaybeValue: nullable variables and input fields are typed T | null, as IQueryVariablesDto of @meshmakers/octo-services.
overwrite: true
hooks:
  afterAllFileWrite:
    - node scripts/codegen-strip-incremental.mjs
schema:
  - 'graphql/ci.schema.graphql'
  - 'graphql/sample.schema.graphql'
documents: 'src/app/sample/graphQL/*.graphql'
generates:
  src/app/sample/graphQL/globalTypes.ts:
    plugins:
      - 'typescript'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      scalars:
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkRecordId: string
        CkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any
  src/app/sample/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      importSchemaTypesFrom: 'src/app/sample/graphQL/globalTypes'
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      inputMaybeValue: 'T | null'
      scalars:
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkRecordId: string
        CkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        RtCkAssociationRoleId: any
        RtCkEnumId: any
        RtCkRecordId: any
        RtCkTypeId: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any

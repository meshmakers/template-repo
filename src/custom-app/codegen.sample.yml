# GraphQL code generation for the optional sample (npm run codegen:sample).
#
# Needs a tenant schema that contains the sample CK model (`src/CustomAppCkModel`), so import that
# model into your tenant first and export the schema again. Same schema file as codegen.yml:
# `schema.json` by default, or the file in OCTO_GRAPHQL_SCHEMA.
#
# The generated sample code is committed, so you need this only when you change the sample query.
# The generated file is self-contained: it holds the enums it uses, there is no globalTypes.ts for the sample.
overwrite: true
schema: '${OCTO_GRAPHQL_SCHEMA:schema.json}'
documents: 'src/app/sample/graphQL/*.graphql'
generates:
  src/app/sample/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      inputMaybeValue: 'T | null'
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any

# GraphQL code generation for the optional sample query in src/app/sample/graphQL/*.graphql (npm run codegen:sample).
#
# Its schema is fixed: graphql/ci.schema.graphql plus graphql/sample.schema.graphql, a hand-derived excerpt of the
# sample CK model. When you change the sample query or the sample CK model, update the excerpt; npm run test:codegen
# fails when it no longer matches the CK model. The generated files are not committed.
#
# Options as in codegen.yml.
overwrite: true
schema:
  - 'graphql/ci.schema.graphql'
  - 'graphql/sample.schema.graphql'
documents: 'src/app/sample/graphQL/*.graphql'
generates:
  src/app/sample/graphQL/globalTypes.ts:
    plugins:
      - 'typescript'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      onlyOperationTypes: true
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any
  src/app/sample/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      importSchemaTypesFrom: 'src/app/sample/graphQL/globalTypes'
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      inputMaybeValue: 'T | null'
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any

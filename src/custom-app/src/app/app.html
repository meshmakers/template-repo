<kendo-appbar position="top" themeColor="dark">
  <kendo-appbar-section>
    <button kendoButton fillMode="flat" (click)="toggleDrawer()">
      <kendo-svg-icon
        [icon]="{ name: 'menu', content: 'M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z', viewBox: '0 0 24 24' }"
      ></kendo-svg-icon>
    </button>
  </kendo-appbar-section>

  <kendo-appbar-section>
    <h1 class="title">CustomApp</h1>
  </kendo-appbar-section>

  <kendo-appbar-spacer></kendo-appbar-spacer>

  <kendo-appbar-section>
    <span class="version-label">v{{ version }}</span>
  </kendo-appbar-section>

  <kendo-appbar-spacer width="16px"></kendo-appbar-spacer>

  <kendo-appbar-section>
    <button
      kendoButton
      fillMode="flat"
      (click)="themeService.toggle()"
      [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (themeService.isDark()) {
        <kendo-svg-icon
          [icon]="{ name: 'light-mode', content: 'M20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69L23.31 12 20 8.69zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z', viewBox: '0 0 24 24' }"
        ></kendo-svg-icon>
      } @else {
        <kendo-svg-icon
          [icon]="{ name: 'dark-mode', content: 'M10 2c-1.82 0-3.53.5-5 1.35C7.99 5.08 10 8.3 10 12s-2.01 6.92-5 8.65C6.47 21.5 8.18 22 10 22c5.52 0 10-4.48 10-10S15.52 2 10 2z', viewBox: '0 0 24 24' }"
        ></kendo-svg-icon>
      }
    </button>
  </kendo-appbar-section>

  <kendo-appbar-section>
    <mm-login-app-bar-section />
  </kendo-appbar-section>
</kendo-appbar>

<kendo-drawer-container>
  <kendo-drawer
    #drawer
    [items]="(drawerItems$ | async) ?? []"
    mode="push"
    [mini]="true"
    [expanded]="expanded()"
    [autoCollapse]="false"
    (select)="onDrawerSelect($event)"
    [isItemExpanded]="isItemExpanded"
  >
  </kendo-drawer>

  <kendo-drawer-content>
    <div class="header-area px-4 py-2">
      <kendo-breadcrumb
        [items]="(breadCrumbItems$ | async) ?? []"
        (itemClick)="onBreadCrumbItemClick($event)"
      ></kendo-breadcrumb>
    </div>
    <div class="octo-body">
      <router-outlet />
    </div>
  </kendo-drawer-content>
</kendo-drawer-container>

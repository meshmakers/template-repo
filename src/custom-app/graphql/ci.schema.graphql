# GraphQL schema of a fresh tenant: only the System Construction Kits and Basic, no app model.
# CI runs codegen.yml against this file (npm run codegen:check), so a query in src/app/graphQL/
# that needs a type a fresh tenant does not have fails the build.
# Once your app queries its own CK model, replace this file with the schema of a tenant that
# has that model (export_runtime_graphql_sdl, or the SDL download of the tenant).

schema {
  query: OctoQuery
  mutation: OctoMutation
  subscription: OctoSubscriptions
}

enum AggregationInputTypes {
  AVERAGE
  COUNT
  MAXIMUM
  MINIMUM
  SUM
}

enum AggregationType {
  AVG
  COUNT
  MAX
  MIN
  STATE_DURATION
  SUM
  TIME_WEIGHTED_AVG
}

enum AggregationTypes {
  AVERAGE
  COUNT
  MAXIMUM
  MINIMUM
  NONE
  STATE_DURATION
  SUM
  TIME_WEIGHTED_AVERAGE
}


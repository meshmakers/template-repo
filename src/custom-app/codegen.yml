# GraphQL code generation for the app's own queries in src/app/graphQL/*.graphql.
#
# npm run codegen generates this config and codegen.sample.yml (scripts/codegen.js); npm start, npm test, npm run lint
# and the builds run it first, and so do the pipeline and the Docker build. The generated files are not committed.
#
# Schema, the first that exists: OCTO_GRAPHQL_SCHEMA, schema.json (your tenant's export, gitignored),
# graphql/ci.schema.json (your model, committed for CI), graphql/ci.schema.graphql (a fresh tenant, committed).
# The queries here must work on a fresh tenant (System CKs and Basic) until you commit graphql/ci.schema.json.
#
# typesSuffix: generated types and services end in Dto (GetAssetsQueryDto, GetAssetsDtoGQL).
# onlyOperationTypes: globalTypes.ts holds only the enums and inputs the operations use.
# importSchemaTypesFrom: the operation files import those types from globalTypes.ts.
# nonOptionalTypename / skipTypeNameForRoot: every object type carries a required __typename, the root query none.
# inputMaybeValue: nullable variables and input fields are typed T | null, as IQueryVariablesDto of @meshmakers/octo-services.
# scalars: ids are strings, every other scalar any.
overwrite: true
schema: '${OCTO_GRAPHQL_SCHEMA:schema.json}'
documents: 'src/app/graphQL/*.graphql'
generates:
  src/app/graphQL/globalTypes.ts:
    plugins:
      - 'typescript'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      onlyOperationTypes: true
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any
  src/app/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      importSchemaTypesFrom: 'src/app/graphQL/globalTypes'
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      inputMaybeValue: 'T | null'
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any

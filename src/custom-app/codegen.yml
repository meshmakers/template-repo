# GraphQL code generation for the app's own queries in src/app/graphQL/*.graphql (npm run codegen).
#
# Run npm run codegen (and npm run codegen:sample for the sample) after cloning and after changing a .graphql file;
# CI and the Docker build run both. The generated files are not committed.
#
# Schema: graphql/ci.schema.graphql, the committed schema of a fresh tenant (System CKs and Basic). Generate against
# another file with OCTO_GRAPHQL_SCHEMA, for example your tenant's export: OCTO_GRAPHQL_SCHEMA=schema.json npm run codegen.
# Once your queries use your own CK model, commit that export (graphql/ci.schema.json) and point the default here at it.
#
# typesSuffix: generated types and services end in Dto (GetAssetsQueryDto, GetAssetsDtoGQL).
# onlyOperationTypes: globalTypes.ts holds only the enums and inputs the operations use.
# importSchemaTypesFrom: the operation files import those types from globalTypes.ts.
# nonOptionalTypename / skipTypeNameForRoot: every object type carries a required __typename, the root query none.
# inputMaybeValue: nullable variables and input fields are typed T | null, as IQueryVariablesDto of @meshmakers/octo-services.
# scalars: ids are strings, every other scalar any.
overwrite: true
schema: '${OCTO_GRAPHQL_SCHEMA:graphql/ci.schema.graphql}'
documents: 'src/app/graphQL/*.graphql'
generates:
  src/app/graphQL/globalTypes.ts:
    plugins:
      - 'typescript'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      onlyOperationTypes: true
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any
  src/app/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      importSchemaTypesFrom: 'src/app/graphQL/globalTypes'
      nonOptionalTypename: true
      skipTypeNameForRoot: true
      inputMaybeValue: 'T | null'
      scalars:
        OctoObjectId: string
        RtCkAssociationRoleId: string
        RtCkEnumId: string
        RtCkRecordId: string
        RtCkTypeId: string
        BigInt: any
        Byte: any
        CkVersion: any
        DateTime: any
        DateTimeOffset: any
        Decimal: any
        LargeBinary: any
        Long: any
        Seconds: any
        SimpleScalar: any
        ULong: any
        Uri: any

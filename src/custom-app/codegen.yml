# GraphQL code generation for the app's own queries (npm run codegen).
#
# Schema: the GraphQL schema of your tenant, by default `schema.json` in this folder - the
# introspection JSON that the MCP tool `export_runtime_graphql_sdl` returns. Point it at another
# file with the environment variable OCTO_GRAPHQL_SCHEMA, for example an SDL download:
#   OCTO_GRAPHQL_SCHEMA=schema.graphql npm run codegen
# The file is tenant specific and not committed (.gitignore).
#
# Documents: only `src/app/graphQL/*.graphql`. They must use types every tenant has (the System
# CKs), so codegen also runs on a fresh tenant. The sample query of the template lives in
# `src/app/sample/graphQL/` and has its own config (codegen.sample.yml, npm run codegen:sample)
# because its type exists only after the sample CK model is imported.
#
# Check: npm run codegen:check runs this config in memory against your schema.json, a committed
# graphql/ci.schema.json or graphql/ci.schema.graphql (the first that exists; see scripts/codegen-check.js).
# typesSuffix: every generated type and service gets the suffix Dto (GetAssetsQueryDto, GetAssetsDtoGQL).
overwrite: true
schema: '${OCTO_GRAPHQL_SCHEMA:schema.json}'
documents: 'src/app/graphQL/*.graphql'
generates:
  src/app/graphQL/globalTypes.ts:
    plugins:
      - 'typescript'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      scalars:
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkRecordId: string
        CkTypeId: string
  src/app/graphQL/:
    preset: near-operation-file
    presetConfig:
      extension: .generated.ts
      baseTypesPath: globalTypes.ts
    plugins:
      - 'typescript-operations'
      - 'typescript-apollo-angular'
    config:
      enumsAsTypes: true
      typesSuffix: 'Dto'
      scalars:
        OctoObjectId: string
        CkAttributeId: string
        CkEnumId: string
        CkRecordId: string
        CkTypeId: string

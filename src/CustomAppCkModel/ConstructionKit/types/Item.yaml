$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
  - typeId: Item
    derivedFromCkTypeId: ${System}/Entity
    description: "Example entity of the custom app — replace it with your own domain types"
    attributes:
      - id: ${System}/Name
        name: Name
      - id: ${System}/Description
        name: Description
        isOptional: true
      - id: ${this}/ItemCode
        name: Code
      - id: ${this}/ItemQuantity
        name: Quantity
        isOptional: true
      - id: ${this}/ItemStatus
        name: Status
